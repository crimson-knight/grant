name: debug-link (temporary)
on:
  push:
    branches: [ci/apt-update]
    paths: ['.github/workflows/debug-link.yml']
jobs:
  link:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default, fresh-cache, no-debug, gold, lld, no-export]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - run: shards install --frozen --skip-postinstall --skip-executables
      - name: Build and run associations#2
        env:
          CURRENT_ADAPTER: sqlite
          SQLITE_DATABASE_URL: sqlite3:./grant.db
        run: |
          set -x
          files=$(ls spec/grant/associations/*_spec.cr | sed -n 13,24p | tr '\n' ' ')
          flags=""
          case "${{ matrix.variant }}" in
            no-debug) flags="--no-debug" ;;
            gold) flags="--link-flags=-fuse-ld=gold" ;;
            lld) sudo apt-get install -y lld >/dev/null; flags="--link-flags=-fuse-ld=lld" ;;
            no-export) flags="--link-flags=-Wl,--no-export-dynamic" ;;
          esac
          export CRYSTAL_CACHE_DIR=$PWD/.cc
          if [ "${{ matrix.variant }}" = default ]; then
            # Prime the cache with a different program first, as the grouped run does.
            crystal spec spec/grant/error/*_spec.cr > /dev/null || true
          fi
          /usr/bin/time -v crystal build $flags $files -o assoc_bin 2>&1 | tail -25
          ls -la assoc_bin
          readelf -h assoc_bin | grep -E "Number of section|Section header string"
          readelf -S -W assoc_bin | grep -E "dynsym|dynstr|gnu.version|\.text|debug_info" 
          echo "dynsym count: $(readelf --dyn-syms -W assoc_bin | wc -l)"
          readelf -V -W assoc_bin | head -30
          ./assoc_bin 2>&1 | tail -5
