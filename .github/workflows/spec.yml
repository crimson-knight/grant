name: spec
on:
  # Branch pushes are checked through their pull request.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 6" # Every Saturday 6 AM

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install shards
        run: shards install --frozen
      - name: Build ameba
        # Ameba 1.7.0-dev ships no postinstall or executables, so shards
        # install leaves no bin/ameba; build it from the locked source.
        run: mkdir -p bin && crystal build lib/ameba/src/cli.cr -o bin/ameba
      - name: Check runtime dependencies' Crystal floors
        # No runtime dependency may need a newer Crystal than shard.yml declares.
        run: scripts/crystal-floor.sh check-deps
      - name: Check formatting
        run: crystal tool format --check
      - name: Check linting
        run: ./bin/ameba

  # crystal-alpha's default Regex engine is Mica, which leaves out lookaround,
  # backreferences, atomic groups and possessive quantifiers. This job checks
  # every regex in the repository against Mica's dialect, including code no
  # spec reaches, so a pattern that would stop an app's build fails here.
  regex-on-mica:
    runs-on: ubuntu-24.04
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Check every regex against Mica's dialect
        run: scripts/check_regex_on_mica.sh
        env:
          CRYSTAL: crystal

  # The floor is the minimum Crystal in shard.yml (scripts/crystal-floor.sh
  # reads it; no workflow repeats the number). This job builds Grant and runs
  # the SQLite suite on exactly that version, so a change that needs a newer
  # Crystal fails here. See docs/RELEASING.md.
  minimum-crystal:
    uses: ./.github/workflows/minimum-crystal.yml

  # Informational: the latest patch of the minor version below the floor
  # should NOT compile. If it does, the floor may be higher than necessary.
  below-minimum:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Find the release below the floor
        id: below
        run: |
          version=$(scripts/crystal-floor.sh below)
          echo "Below the floor: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ steps.below.outputs.version }}
      - name: Install shards
        # Ameba (development only) declares crystal ~> 1.19; this job only
        # type-checks Grant, so dependency Crystal constraints are not enforced.
        run: shards install --frozen --skip-postinstall --skip-executables --ignore-crystal-version
      - name: Expect Grant not to compile
        env:
          BELOW: ${{ steps.below.outputs.version }}
        run: |
          crystal --version
          if crystal build --no-codegen src/grant.cr; then
            echo "::warning::Grant compiles on Crystal $BELOW, below the declared floor $(scripts/crystal-floor.sh floor). The floor in shard.yml may be higher than necessary."
            exit 1
          fi
          echo "Grant does not compile on Crystal $BELOW, as expected for the declared floor."

  # The database suites run in six slices each (spec-groups.sh --shard), side
  # by side, so no job comes near its timeout. Compiling each group is most of
  # the cost; the slices are balanced on an estimate of it. A slice that runs
  # past 25 minutes is a regression to look at, not a reason to raise the limit.
  sqlite-spec:
    name: sqlite-spec (${{ matrix.crystal }}, ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Latest Crystal; minimum-crystal covers the floor from shard.yml.
        crystal: [1.21.0]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Check that the default path links no GMP
        # Builds the probe apps in scripts/linkage; the BigDecimal control
        # probe must link GMP, so the check is known to be able to fail.
        if: matrix.shard == 1
        run: ruby scripts/check_gmp_linkage.rb
        env:
          CRYSTAL: crystal
      - name: Check that Grant links no libz
        # Builds the probe apps in scripts/linkage; the Compress::Zlib control
        # probe must link libz, so the check is known to be able to fail.
        if: matrix.shard == 2
        run: ruby scripts/check_zlib_linkage.rb
        env:
          CRYSTAL: crystal
      - name: Check that a Grant app on Grant's SQLite engine links no libsqlite3
        # Builds the default app workload on grant/adapter/sqlite/grant_engine
        # (no flags) and with -Dgrant_without_libsqlite3, and runs both; the
        # control build on grant/adapter/sqlite must link libsqlite3, so the
        # check is known to be able to fail.
        if: matrix.shard == 3
        run: ruby scripts/check_sqlite3_linkage.rb
        env:
          CRYSTAL: crystal
      - name: Run tests
        # The whole suite compiled as one program needs about 20 GB of RAM; a
        # runner has 16 GB. spec-groups.sh compiles one group at a time.
        timeout-minutes: 25
        run: scripts/spec-groups.sh --shard ${{ matrix.shard }}/6 sqlite
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: sqlite
          SQLITE_DATABASE_URL: sqlite3:./grant.db
          SQLITE_REPLICA_URL: sqlite3:./grant_replica.db

  # MySQL 8.4 and 9.x both default to caching_sha2_password, and the grant
  # user is pinned to it below, so every connection these jobs open goes
  # through Grant's caching_sha2_password handshake (Thread 3b). No
  # mysql_native_password override anywhere.
  mysql-spec:
    name: mysql-spec (${{ matrix.crystal }}, MySQL ${{ matrix.mysql.version }}, ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Latest Crystal; minimum-crystal covers the floor from shard.yml.
        crystal: [1.21.0]
        mysql:
          - version: "8.4.13"
            digest: "8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00"
          - version: "9.7.4"
            digest: "1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1"
        shard: [1, 2, 3, 4, 5, 6]
    services:
      mysql-primary:
        image: "mysql:${{ matrix.mysql.version }}@sha256:${{ matrix.mysql.digest }}"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: grant_db
          MYSQL_USER: grant
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
      mysql-replica:
        image: "mysql:${{ matrix.mysql.version }}@sha256:${{ matrix.mysql.digest }}"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: grant_replica_db
          MYSQL_USER: grant
          MYSQL_PASSWORD: password
        ports:
          - 3307:3306
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Pin caching_sha2_password and let the grant user create scratch databases
        # The schema and task specs create and drop their own databases.
        run: |
          for port in 3306 3307; do
            mysql -h 127.0.0.1 -P $port -u root -ppassword <<'SQL'
          ALTER USER 'grant'@'%' IDENTIFIED WITH caching_sha2_password BY 'password';
          GRANT ALL PRIVILEGES ON *.* TO 'grant'@'%';
          FLUSH PRIVILEGES;
          SELECT user, host, plugin FROM mysql.user WHERE user = 'grant';
          SELECT VERSION();
          SQL
          done
      - name: Verify caching_sha2_password auth for the grant user
        run: |
          mysqladmin ping -h 127.0.0.1 -P 3306 -u grant -ppassword | grep "mysqld is alive"
      - name: Run tests
        # The whole suite compiled as one program needs about 20 GB of RAM; a
        # runner has 16 GB. spec-groups.sh compiles one group at a time.
        timeout-minutes: 25
        run: scripts/spec-groups.sh --shard ${{ matrix.shard }}/6 mysql
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: mysql
          # ssl-mode=required: every connection runs over TLS (Beryl, TLS 1.3;
          # the images generate their own certificates).
          MYSQL_DATABASE_URL: mysql://grant:password@127.0.0.1:3306/grant_db?ssl-mode=required
          MYSQL_REPLICA_URL: mysql://grant:password@127.0.0.1:3307/grant_replica_db?ssl-mode=required

  # Every PostgreSQL server here takes TLS 1.3 only and refuses connections
  # without TLS (scripts/pg-tls-test-servers.sh), and the suite connects with
  # sslmode=verify-full, so each slice runs over Beryl TLS 1.3. The primary
  # trusts its logins: a SCRAM-SHA-256 handshake runs 4,096 PBKDF2 rounds
  # in Grant's driver for every new connection, and the pool specs open
  # thousands. The replica server keeps scram-sha-256, and
  # tls_verification_spec.cr logs in to it with SCRAM-SHA-256-PLUS.
  psql-spec:
    name: psql-spec (PostgreSQL ${{ matrix.postgres.version }}, ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - version: "17.12"
            digest: "87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf"
          - version: "19.0"
            digest: "aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1"
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Run pg_dump and psql from the pinned server image
        # pg_dump refuses a newer server, and the schema specs run pg_dump and
        # psql. Both run from the same digest-pinned image as the server, with
        # the runner's paths mounted where they are, so files and certificates
        # resolve as on the host.
        run: |
          tools="$RUNNER_TEMP/pg-tools"
          mkdir -p "$tools"
          for tool in pg_dump psql; do
            printf '%s\n' '#!/bin/sh' \
              "exec docker run --rm -i --network host -e PGPASSWORD -e PGSSLMODE -e PGSSLROOTCERT -e PGSSLMINPROTOCOLVERSION -e PGSSLCERT -e PGSSLKEY -v /tmp:/tmp -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -v \"$RUNNER_TEMP:$RUNNER_TEMP\" -w \"\$PWD\" \"$PG_IMAGE\" $tool \"\$@\"" > "$tools/$tool"
            chmod +x "$tools/$tool"
          done
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/pg_dump" --version
        env:
          PG_IMAGE: postgres:${{ matrix.postgres.version }}@sha256:${{ matrix.postgres.digest }}
      - name: Start the TLS 1.3 PostgreSQL servers
        run: scripts/pg-tls-test-servers.sh "postgres:${{ matrix.postgres.version }}@sha256:${{ matrix.postgres.digest }}" "$RUNNER_TEMP/pg-tls" >> "$GITHUB_ENV"
      - name: Run tests
        # The whole suite compiled as one program needs about 20 GB of RAM; a
        # runner has 16 GB. spec-groups.sh compiles one group at a time.
        # spec/grant/sharding and spec/grant/composite are among the groups.
        timeout-minutes: 25
        run: scripts/spec-groups.sh --shard ${{ matrix.shard }}/6 pg
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: pg
