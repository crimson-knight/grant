name: spec
on:
  # Branch pushes are checked through their pull request.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 6" # Every Saturday 6 AM

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install shards
        run: shards install --frozen
      - name: Build ameba
        # Ameba 1.7.0-dev ships no postinstall or executables, so shards
        # install leaves no bin/ameba; build it from the locked source.
        run: mkdir -p bin && crystal build lib/ameba/src/cli.cr -o bin/ameba
      - name: Check runtime dependencies' Crystal floors
        # No runtime dependency may need a newer Crystal than shard.yml declares.
        run: scripts/crystal-floor.sh check-deps
      - name: Check formatting
        run: crystal tool format --check
      - name: Check linting
        run: ./bin/ameba

  # The floor is the minimum Crystal in shard.yml (scripts/crystal-floor.sh
  # reads it; no workflow repeats the number). This job builds Grant and runs
  # the SQLite suite on exactly that version, so a change that needs a newer
  # Crystal fails here. See docs/RELEASING.md.
  minimum-crystal:
    uses: ./.github/workflows/minimum-crystal.yml

  # Informational: the latest patch of the minor version below the floor
  # should NOT compile. If it does, the floor may be higher than necessary.
  below-minimum:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Find the release below the floor
        id: below
        run: |
          version=$(scripts/crystal-floor.sh below)
          echo "Below the floor: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ steps.below.outputs.version }}
      - name: Install shards
        # Ameba (development only) declares crystal ~> 1.19; this job only
        # type-checks Grant, so dependency Crystal constraints are not enforced.
        run: shards install --frozen --skip-postinstall --skip-executables --ignore-crystal-version
      - name: Expect Grant not to compile
        env:
          BELOW: ${{ steps.below.outputs.version }}
        run: |
          crystal --version
          if crystal build --no-codegen src/grant.cr; then
            echo "::warning::Grant compiles on Crystal $BELOW, below the declared floor $(scripts/crystal-floor.sh floor). The floor in shard.yml may be higher than necessary."
            exit 1
          fi
          echo "Grant does not compile on Crystal $BELOW, as expected for the declared floor."

  sqlite-spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest Crystal; minimum-crystal covers the floor from shard.yml.
        crystal: [1.21.0]
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Run tests
        # The whole suite compiled as one program needs about 20 GB of RAM; a
        # runner has 16 GB. spec-groups.sh compiles one group at a time.
        timeout-minutes: 60
        run: scripts/spec-groups.sh sqlite
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: sqlite
          SQLITE_DATABASE_URL: sqlite3:./grant.db
          SQLITE_REPLICA_URL: sqlite3:./grant_replica.db

  mysql-spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest Crystal; minimum-crystal covers the floor from shard.yml.
        crystal: [1.21.0]
    services:
      mysql-primary:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: grant_db
          MYSQL_USER: grant
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
      mysql-replica:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: grant_replica_db
          MYSQL_USER: grant
          MYSQL_PASSWORD: password
        ports:
          - 3307:3306
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Let the grant user create scratch databases
        # The schema and task specs create and drop their own databases.
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword <<'SQL'
          GRANT ALL PRIVILEGES ON *.* TO 'grant'@'%';
          FLUSH PRIVILEGES;
          SELECT VERSION();
          SQL
      - name: Run tests
        # The whole suite compiled as one program needs about 20 GB of RAM; a
        # runner has 16 GB. spec-groups.sh compiles one group at a time.
        timeout-minutes: 60
        run: scripts/spec-groups.sh mysql
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: mysql
          MYSQL_DATABASE_URL: mysql://grant:password@localhost:3306/grant_db
          MYSQL_REPLICA_URL: mysql://grant:password@localhost:3307/grant_replica_db

  # Dedicated job exercising the DEFAULT caching_sha2_password auth plugin on
  # both MySQL 8.x and MySQL 9.x (Thread 3b). No mysql_native_password override
  # anywhere — this validates Grant's caching_sha2_password handshake against a
  # default-configured server. Mirrors docker-compose.test.yml (mysql8/mysql9).
  mysql-caching-sha2-spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: [1.21.0]
        mysql:
          - version: "8.0"
            digest: "7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b"
          - version: "9.0"
            digest: "92dc869678019f65d761155dacac660a904f6245bfe1b7997da0a73b2bfc68c9"
    services:
      mysql:
        image: "mysql:${{ matrix.mysql.version }}@sha256:${{ matrix.mysql.digest }}"
        # NOTE: no --default-authentication-plugin override. MySQL 8.0+ and
        # 9.x default to caching_sha2_password.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: grant_db
          MYSQL_USER: grant
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Ensure grant user uses caching_sha2_password
        # The entrypoint already creates MYSQL_USER with the server default
        # plugin, but we pin it explicitly so the test intent is unambiguous,
        # and we confirm the plugin assignment in the job log.
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword <<'SQL'
          ALTER USER 'grant'@'%' IDENTIFIED WITH caching_sha2_password BY 'password';
          -- The schema and task specs create and drop scratch databases.
          GRANT ALL PRIVILEGES ON *.* TO 'grant'@'%';
          FLUSH PRIVILEGES;
          SELECT user, host, plugin FROM mysql.user WHERE user = 'grant';
          SELECT VERSION();
          SQL
      - name: Verify caching_sha2_password auth for grant user
        run: |
          mysqladmin ping -h 127.0.0.1 -P 3306 -u grant -ppassword | grep "mysqld is alive"
      - name: Run tests
        # The whole suite compiled as one program needs about 20 GB of RAM; a
        # runner has 16 GB. spec-groups.sh compiles one group at a time.
        timeout-minutes: 60
        run: scripts/spec-groups.sh mysql
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: mysql
          MYSQL_DATABASE_URL: mysql://grant:password@127.0.0.1:3306/grant_db
          MYSQL_REPLICA_URL: mysql://grant:password@127.0.0.1:3306/grant_db

  psql-spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest Crystal; minimum-crystal covers the floor from shard.yml.
        crystal: [1.21.0]
    services:
      postgres-primary:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: grant
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grant_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      postgres-replica:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: grant
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grant_replica_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Run tests
        # The whole suite compiled as one program needs about 20 GB of RAM; a
        # runner has 16 GB. spec-groups.sh compiles one group at a time.
        timeout-minutes: 60
        run: scripts/spec-groups.sh pg
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: pg
          PG_DATABASE_URL: postgres://grant:password@localhost:5432/grant_db
          PG_REPLICA_URL: postgres://grant:password@localhost:5433/grant_replica_db

  sharding-spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: [1.21.0]
    services:
      # The sharding specs create and drop their own shard databases on this
      # server (spec/support/w6_c04_support.cr), so one server is enough.
      postgres:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: grant
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grant_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Run sharding tests
        timeout-minutes: 30
        run: scripts/spec-groups.sh --only spec/grant/sharding --only spec/grant/composite pg
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: pg
          PG_DATABASE_URL: postgres://grant:password@localhost:5432/grant_db
