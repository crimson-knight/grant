name: Connection Failover Tests
on:
  push:
    branches: [main, master]
    paths:
      - 'src/grant/connection_management.cr'
      - 'src/grant/connection_registry.cr'
      - 'src/grant/health_monitor.cr'
      - 'spec/grant/connection/**'
      - 'spec/**/*failover*'
      - 'spec/**/*connection*'
      - 'scripts/spec-groups.sh'
      - '.github/workflows/failover.yml'
  pull_request:
    paths:
      - 'src/grant/connection_management.cr'
      - 'src/grant/connection_registry.cr'
      - 'src/grant/health_monitor.cr'
      - 'spec/grant/connection/**'
      - 'spec/**/*failover*'
      - 'spec/**/*connection*'
      - 'scripts/spec-groups.sh'
      - '.github/workflows/failover.yml'

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The connection specs (failover, reconnect, pool, replica routing) live in
# spec/grant/connection. They create any extra databases they need on the
# primary server, so each job runs one primary and one replica.
jobs:
  postgres-failover:
    runs-on: ubuntu-latest
    services:
      postgres-primary:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: grant
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grant_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      postgres-replica:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: grant
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grant_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Run connection and failover tests
        timeout-minutes: 30
        run: scripts/spec-groups.sh --only spec/grant/connection pg
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: pg
          PG_DATABASE_URL: postgres://grant:password@localhost:5432/grant_db
          PG_REPLICA_URL: postgres://grant:password@localhost:5433/grant_db

  mysql-failover:
    runs-on: ubuntu-latest
    services:
      mysql-primary:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: grant_db
          MYSQL_USER: grant
          MYSQL_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      mysql-replica:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: grant_db
          MYSQL_USER: grant
          MYSQL_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3307:3306
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        # install-crystal apt-installs libevent and friends without updating
        # the index first, and the runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Run connection and failover tests
        timeout-minutes: 30
        run: scripts/spec-groups.sh --only spec/grant/connection mysql
        env:
          CRYSTAL: crystal
          SPEC_GROUP_INCREMENTAL: "0"
          SPEC_GROUP_MAX_RSS_GB: "13"
          CURRENT_ADAPTER: mysql
          MYSQL_DATABASE_URL: mysql://grant:password@localhost:3306/grant_db
          MYSQL_REPLICA_URL: mysql://grant:password@localhost:3307/grant_db
