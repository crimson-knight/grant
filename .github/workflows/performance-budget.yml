name: performance-budget
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install locked shards
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Check compile-memory budgets
        run: python3 scripts/compile_memory.py check
        env:
          CRYSTAL_BIN: crystal
          CRYSTAL_SLOT: ""
      - name: Build lifecycle benchmark
        run: crystal build --release bench/lifecycle_bench.cr --link-flags=-Wl,--no-export-dynamic -o /tmp/grant-lifecycle
        env:
          BENCH_ADAPTER: sqlite
      - name: Run lifecycle benchmark
        run: /tmp/grant-lifecycle --iterations 2000 --rounds 5 --grant-only --label perf03-builder --json /tmp/grant-lifecycle.json
        env:
          BENCH_DATABASE_URL: sqlite3:/tmp/grant-lifecycle.db
      - name: Check lifecycle budgets
        run: python3 scripts/check_runtime_budget.py /tmp/grant-lifecycle.json --mode ci
